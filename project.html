    dateDisplay: "2023",
    tags: ["AI"],
    desc: `
      <section id="breakthrough">
              <h2>Game Rules (Breakthrough)</h2>
              <p>Breakthrough is a strategy board game created by Dan Troyka in 2000. It won the 8x8 Best Board Game Design Contest and has some similarities to Checkers, but the strategy is different.</p>
              <p>The objective of the game is to reach the opponent's starting row, which is farthest from the player. This means the white player must reach the 8th row, while the black player must reach the 1st row to win the game.</p>
            </section>
            <br>

            <section id="introduction">
              <h2>Introduction</h2>
              <p>I present in detail the design, implementation, and results of my artificial intelligence program for board games. Our goal was to create an AI capable of making informed and effective decisions in a complex game environment.</p>
            </section>
            <br>

            <section id="alphabeta">
              <h2>Alpha-Beta Pruning</h2>
              <p>Alpha-beta pruning is a technique used in tree search algorithms, such as Minimax, to reduce the number of nodes evaluated. It works by eliminating branches of the search tree that do not contribute to the final decision. This is done using two values, alpha and beta, to track the minimum and maximum values respectively, allowing branches that cannot improve the current outcome to be eliminated. This significantly reduces the computation time needed to find the best action to take.</p>
            </section>
            <br>

            <section id="strategies">
              <h2>Evaluation Function</h2>
              <p>Our evaluation function is divided into three main points:</p>
              <ol>
                <li>Calculating the number of pieces on the board and assigning points based on the surplus or deficit compared to the opponent.</li>
                <li>Assigning points to each square on the board, with a 50% bonus for squares containing secure pawns.</li>
                <li>Evaluating positions based on criteria such as the strategic importance of pieces, their mobility, advanced positions, and direct threats to opposing pieces.</li>
              </ol>
              <p>We also use a position score matrix to assign points to each square on the board, favoring solid defense on important positions while encouraging advancement toward the front and center. Finally, we added a 50% bonus for secure pawns, further strengthening our defensive strategy and improving our program's control of the board.</p>
              <img src="../assets/img/breaktrough-2.png" alt="Position score matrix for black pawns." width=auto>
            </section>
    `,

    tags: ["AI", "Assistant", "Bot", "Python"],
    desc: `
      <h3>Project Description</h3>
      <p>
        This is a chatbot built in Python using artificial intelligence to respond to user needs,
        such as web requests, or simply to chat with them.
      </p>

      <p>
        The bot is still under development, but its abilities are improving very quickly.
        It is currently able to perform YouTube searches, check the weather, and send the link
        to its GitHub repository.
      </p>

      <p>
        Conversations with it are still a bit difficult, but with more training it will be able
        to answer increasingly complex questions. As you can see in the second image, I had to
        reset its memory many times because it was blindly learning the sentences I told it
        without really understanding them.
      </p>

      <h3>IT Maintenance</h3>
      <p>
        For this maintenance phase, I decided to add various conversation topics to the bot.
        I also took the opportunity to fix a bug that had been present since I added the graphical
        interface. I also updated the README to reflect the bot’s capabilities.
      </p>

      <h4>February 23, 2022 – Display bug fix</h4>
      <p>
        For long texts sent by the user, or links sent by the bot, the text would go beyond the
        chat window. The solution was to reduce the font size for texts longer than 62 characters.
      </p>

      <h4>February 22, 2022 – Added conversation topics</h4>
      <p>The bot can now have conversations on a wider variety of topics.</p>
      <ul>
        <li>Topic: Introduction</li>
        <li>Topic: Hobbies</li>
        <li>Topic: Passions</li>
        <li>Topic: Humor / Jokes</li>
      </ul>

      <h4>February 14, 2022 – Second bot memory reset</h4>
      <p>
        The bot had remembered incoherent things after the YouTube search feature was added.
      </p>

      <h4>February 14, 2022 – Code improvement</h4>
      <p>
        All functions and variables are now in English, and the code has been better commented.
      </p>

      <h4>February 11, 2022 – Second web request feature</h4>
      <p>
        The bot can now perform YouTube searches and send them to the user.
      </p>

      <h4>February 11, 2022 – Added a training list</h4>
      <p>
        The bot now has a list of conversations it can repeat in order to learn them.
      </p>

      <h4>February 8, 2022 – Added the bot’s graphical interface</h4>
      <p>
        Until then, the bot only worked through the command prompt. It now has a graphical
        interface coded using the Tkinter library in Python.
      </p>

      <h4>February 8, 2022 – First bot memory reset</h4>
      <p>
        The bot had learned incorrect things or things that were no longer useful.
      </p>

      <h4>February 8, 2022 – First web request</h4>
      <p>
        The bot can now provide the weather when the user asks, thanks to a web request.
      </p>

      <h4>February 2, 2022 – First version of the bot</h4>
      <p>
        The bot is able to answer the first questions it is asked.
      </p>

      <h4>January 26, 2022 – Start of analysis phase</h4>
      <p>
        Beginning of research and creation of analysis documents.
      </p>

      <h3>Technology Watch</h3>
      <p>
        For this project, I decided to use Python instead of Java because I am very comfortable
        with this language, and I already knew that the project would be feasible in Python.
        In addition, Python is known for being one of the best options for creating artificial
        intelligence because of its computing efficiency. It is also the language with the largest
        number of libraries related to deep learning.
      </p>

      <p>
        I was also familiar with the two main graphical interface libraries in Java and Python,
        and I feel much more comfortable with Tkinter, the Python one, because I have used it
        many times.
      </p>

      <p>There are still possibilities in Java with libraries such as:</p>
      <ul>
        <li>d3web</li>
        <li>Tweety</li>
        <li>Deeplearning4j</li>
      </ul>

      <p>
        Both options were free and open-source, with hundreds of thousands of APIs available.
        However, I ultimately chose Python for its speed, ease of use, and the number of libraries
        available, as well as the assurance that I would be able to complete my project.
      </p>

    links: [
      { label: "Itch.io", url: "https://jolanam.itch.io/pocket-platoons", primary: true }
    ],
    gallery: [
      "../assets/img/PocketPlatoon-01.png","../assets/img/PocketPlatoon-02.png","../assets/img/PocketPlatoon-03.png","../assets/img/PocketPlatoon-04.png"

};

  function byId(id){ return document.getElementById(id); }
  const params = new URLSearchParams(location.search);
  const slug = params.get("slug");
  const d = DATA[slug] || Object.values(DATA)[0];

  // Populate textual info
  document.getElementById('crumb').textContent = " / " + d.title;
  byId('title').textContent = d.title + (d.subtitle ? " — " + d.subtitle : "");

  // Ajout de la date dans la section Meta ou Desc
  if (d.dateDisplay) {
    const year = d.date.split('-')[0];
    
    const tagsElem = byId('tags');
    
    tagsElem.setAttribute('data-date', year); 
    
    const dateHtml = `<span class="tag date-tag">${d.dateDisplay}</span>`;
    tagsElem.innerHTML = dateHtml + (d.tags||[]).map(t => `<span class="tag">${t}</span>`).join("");
  }
  byId('desc').innerHTML = d.desc || "";

  const ctaContainer = byId('ctaContainer');
  ctaContainer.innerHTML = ""; // On vide le conteneur au cas où

  if (d.links && Array.isArray(d.links)) {
    d.links.forEach(link => {
      // Création de l'élément <a>
      const btn = document.createElement('a');
      btn.href = link.url || '#';
      btn.textContent = link.label || 'See Project';
      btn.className = 'button'; // Classe de base
      
      // Si c'est marqué comme primary, on ajoute la classe CSS correspondante
      if (link.primary) {
        btn.classList.add('primary');
      }
      
      btn.target = "_blank";
      btn.rel = "noopener";
      
      // On l'ajoute au conteneur
      ctaContainer.appendChild(btn);
    });
  }

  // Build media list (video first if present)

  // Normalize video URLs to privacy-friendly embed URLs
  function toEmbed(url){
    if(!url) return url;
    try{
      // YouTube: accept watch?v=, youtu.be/ID, or embed/ID (strip params like ?si=)
      const yt = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
      if(yt){
        const id = yt[1];
        return `https://www.youtube.com/embed/${id}`;
      }
      // Vimeo
      const vm = url.match(/vimeo\.com\/(?:video\/)?(\d{6,})/);
      if(vm){
        const id = vm[1];
        return `https://player.vimeo.com/video/${id}`;
      }
    }catch(e){}
    return url;
  }
const mediaList = [];
if (d.videoEmbed) mediaList.push({type:'embed', src: d.videoEmbed});
if (d.video)      mediaList.push({type:'video',  src: d.video});
(d.gallery || []).forEach(g => mediaList.push({type:'image', src: g}));


  const viewer = byId('viewer');
  function showImage(src){
    viewer.classList.add('is-image');
    viewer.innerHTML = '<a class="open" id="openFull" href="#">Open</a>';
    viewer.style.backgroundImage = (src.startsWith('url(')||src.startsWith('linear')||src.startsWith('radial'))
      ? src : `url(${src})`;
    document.getElementById('openFull').onclick = (e)=>{ e.preventDefault(); openLightbox({type:'image', src}); };
  }
  function showEmbed(html){
  viewer.classList.remove('is-image');
  viewer.style.backgroundImage = 'none';
  viewer.innerHTML = html;   // insère l'iframe tel quel
}

  function showVideo(src){
    viewer.classList.remove('is-image');
    viewer.style.backgroundImage = 'none';
    // YouTube/Vimeo iframe or direct video
    if (/youtube\.com|youtu\.be|vimeo\.com/.test(src)) {
      viewer.innerHTML = `<iframe src="${toEmbed(src)}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
    } else {
      viewer.innerHTML = `<video src="${src}" controls playsinline></video>`;
    }
  }

  // initial media
 if (mediaList.length) {
  const first = mediaList[0];
  if (first.type === 'embed')      showEmbed(first.src);
  else if (first.type === 'video') showVideo(first.src);
  else                             showImage(first.src);
}


  // thumbnails
  const thumbs = byId('thumbs');
  thumbs.innerHTML = mediaList.map(m => {
    let style = '';
    if (m.type === 'image') {
      style = `style="background-image:${ (m.src.startsWith('url(')||m.src.startsWith('linear')||m.src.startsWith('radial')) ? m.src : 'url('+m.src+')' }"`;
    } else if (m.type === 'video' && d.videoThumb) {
      // Si c'est une vidéo ET qu'une image de vignette a été définie pour le projet, on l'utilise
      style = `style="background-image: url(${d.videoThumb}); background-size: cover; background-position: center;"`;
    }
    return `<button class="thumb ${m.type==='video'?'is-video':''}" ${style}></button>`;
  }).join("");
  Array.from(thumbs.children).forEach((btn, i) => {
    const m = mediaList[i];
    btn.addEventListener('click', () => {
      if (m.type === 'embed')       showEmbed(m.src);
      else if (m.type === 'video')  showVideo(m.src);
      else                          showImage(m.src);
    });
  });


  // Lightbox
  const lb = byId('lightbox'), frame = byId('lightboxFrame'), close = byId('closeLightbox');
  function openLightbox(m){
    lb.classList.add('is-open');
    frame.innerHTML = m.type==='video'
      ? ( /youtube\.com|youtu\.be|vimeo\.com/.test(m.src)
          ? `<iframe class="frame" src="${toEmbed(m.src)}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`
          : `<video class="frame" src="${m.src}" controls autoplay playsinline></video>` )
      : `<img class="frame" src="${m.src.replace(/^url\(|\)$/g,'')}" alt="">`;
  }
  close.onclick = ()=> lb.classList.remove('is-open');
  lb.addEventListener('click',(e)=>{ if(e.target===lb) lb.classList.remove('is-open'); });
  </script>
</body>
